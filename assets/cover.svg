<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Edge Case Studio | Workflow guide</title><desc id="desc">Edge Case Studio. Generate repeatable fixtures from a supported schema and a seed. A sample integer range accepts 1 and 99, and rejects 0 and 100.</desc><rect x="0" y="0" width="1280" height="640" rx="0" fill="#FAF8F0" stroke="none" stroke-width="0"/><rect x="690" y="0" width="590" height="640" rx="0" fill="#CABCF5" stroke="none" stroke-width="0"/><path d="M690 0 L690 640" fill="none" stroke="#15232C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(48 40) scale(0.90625)"><rect x="0" y="0" width="64" height="64" rx="13" fill="#15232C" stroke="none" stroke-width="0"/><path d="M19 14 H12 V49 H19 M39 14 H46 V49 H39 M12 32 H46" fill="none" stroke="#CABCF5" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="26" cy="32" r="5" fill="#CABCF5" stroke="none" stroke-width="0"/><circle cx="54" cy="19" r="4.25" fill="none" stroke="#CABCF5" stroke-width="4"/></g><text x="123" y="62" font-family="Liberation Mono,monospace" font-size="18" fill="#15232C" font-weight="bold" text-anchor="start">FIELD TOOLS</text><text x="123" y="86" font-family="Liberation Mono,monospace" font-size="16" fill="#42525B" font-weight="normal" text-anchor="start">CONTRACT FIXTURES</text><path d="M48 128 L642 128" fill="none" stroke="#15232C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="44" y="256" font-family="Liberation Serif,serif" font-size="103" fill="#15232C" font-weight="normal" text-anchor="start">Edge Case</text><text x="44" y="353" font-family="Liberation Serif,serif" font-size="103" fill="#15232C" font-weight="normal" text-anchor="start">Studio</text><text x="50" y="435" font-family="Liberation Sans,sans-serif" font-size="29" fill="#15232C" font-weight="normal" text-anchor="start">Turn a schema and a seed into repeatable</text><text x="50" y="473" font-family="Liberation Sans,sans-serif" font-size="29" fill="#15232C" font-weight="normal" text-anchor="start">cases your code should accept or reject.</text><path d="M48 547 L642 547" fill="none" stroke="#15232C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="50" y="588" font-family="Liberation Mono,monospace" font-size="18" fill="#15232C" font-weight="bold" text-anchor="start">PLUGIN  /  03</text><text x="642" y="588" font-family="Liberation Mono,monospace" font-size="16" fill="#42525B" font-weight="normal" text-anchor="end">WORKFLOW GUIDE</text><text x="728" y="69" font-family="Liberation Mono,monospace" font-size="17" fill="#15232C" font-weight="bold" text-anchor="start">SAMPLE  /  BOUNDARY VALUES</text><path d="M728 93 L1240 93" fill="none" stroke="#15232C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M727 126 L737 126" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M732 121 L732 131" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M727 520 L737 520" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M732 515 L732 525" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M1231 126 L1241 126" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M1236 121 L1236 131" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M1231 520 L1241 520" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M1236 515 L1236 525" fill="none" stroke="#15232C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><text x="771" y="192" font-family="Liberation Mono,monospace" font-size="