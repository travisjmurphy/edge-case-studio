<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Edge Case Studio | Sample fixture</title><desc id="desc">Edge Case Studio sample: the seeded checkout fixture set expects reject for quantity 0, accept for 1, accept for 99, and reject for 100. These are schema expectations, not observed application results.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FAF8F0" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1280" height="98" rx="0" fill="#15232C" stroke="none" stroke-width="0"/><g transform="translate(44 23) scale(0.8125)"><rect x="0" y="0" width="64" height="64" rx="13" fill="#CABCF5" stroke="none" stroke-width="0"/><path d="M19 14 H12 V49 H19 M39 14 H46 V49 H39 M12 32 H46" fill="none" stroke="#15232C" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="26" cy="32" r="5" fill="#15232C" stroke="none" stroke-width="0"/><circle cx="54" cy="19" r="4.25" fill="none" stroke="#15232C" stroke-width="4"/></g><text x="113" y="64" font-family="Liberation Sans,sans-serif" font-size="27" fill="#FAF8F0" font-weight="bold" text-anchor="start">Edge Case Studio</text><text x="1232" y="59" font-family="Liberation Mono,monospace" font-size="17" fill="#CABCF5" font-weight="bold" text-anchor="end">SAMPLE  /  CONTRACT FIXTURES</text><text x="44" y="185" font-family="Liberation Serif,serif" font-size="65" fill="#15232C" font-weight="normal" text-anchor="start">What happens just outside the limit?</text><text x="48" y="232" font-family="Liberation Sans,sans-serif" font-size="26" fill="#42525B" font-weight="normal" text-anchor="start">Four cases from a 45-case checkout fixture set. Each has a schema expectation.</text><rect x="48" y="267" width="1184" height="50" rx="0" fill="#15232C" stroke="none" stroke-width="0"/><text x="67" y="300" font-family="Liberation Mono,monospace" font-size="20" fill="#FAF8F0" font-weight="bold" text-anchor="start">/lineItem/quantity</text><text x="1211" y="300" font-family="Liberation Mono,monospace" font-size="18" fill="#CABCF5" font-weight="normal" text-anchor="end">INTEGER  /  INCLUSIVE RANGE 1–99</text><rect x="48" y="317" width="296" height="220" rx="0" fill="#FAF8F0" stroke="#15232C" stroke-width="1.3"/><text x="73" y="416" font-family="Liberation Serif,serif" font-size="85" fill="#15232C" font-weight="normal" text-anchor="start">0</text><text x="73" y="463" font-family="Liberation Mono,monospace" font-size="20" fill="#15232C" font-weight="bold" text-anchor="start">REJECT</text><text x="73" y="506" font-family="Liberation Sans,sans-serif" font-size="25" fill="#15232C" font-weight="normal" text-anchor="start">Below minimum</text><rect x="344" y="317" width="296" height="220" rx="0" fill="#CABCF5" stroke="#15232C" stroke-width="1.3"/><text x="369" y="416" font-family="Liberation Serif,serif" font-size="85" fill="#15232C" font-weight="normal" text-anchor="start">1</text><text x="369" y="463" font-family="Liberation Mono,monospace" font-size="20" fill="#15232C" font-weight="bold" text-anchor="start">ACCEPT</text><text x="369" y="506" font-family="Liberation Sans,sans-serif" font-size="25" fill="#15232C" font-weight="normal" text-anchor="start">At minimum</text><rect x="640" y="317" width="296" height="220" rx="0" fill="#CABCF5" stroke="#15232C" stroke-width="1.3"/><text x="665" y="416" font-family="Liberation Serif,serif" font-size="85" fill="#15232C" font-weight="normal" text-anchor="start">99</text><text x="665" y="463" font-family="Liberation Mono,monospace" font-size="20" fill="#15232C" font-weight="bold" text-anchor="start">ACCEPT</text><text x="665" y="506" font-family="Liberation Sans,sans-serif" font-size="25" fill="#15232C" font-weight="normal" text-anchor="start">At maximum</text><rect x="936" y="317" width="296" height="220" rx="0" fill="#FAF8F0" stroke="#15232C" stroke-width="1.3"/><text x="961" y="416" font-family="Liberation Serif,serif" font-size="85" fill="#15232C" font-weight="normal" text-anchor="start">100</text><text x="961" y="463" font-family="Liberation Mono,monospace" font-size="20" fill="#15232C" font-weight="bold" text-anchor="start">REJECT</text><text x="961" y="506" font-family="Liberation Sans,sans-serif" font-size="25" fill="#15232C" font-weight="normal" text-anchor="start">Above maximum</text><text x="48" y="583" font-family="Liberation Sans,sans-serif" font-size="24" fill="#15232C" font-weight="bold" text-anchor="start">Seed:</text><text x="120" y="583" font-family="Liberation Mono,monospace" font-size="23" fill="#15232C" font-weight="normal" text-anchor="start">checkout-42</text><text x="480" y="583" font-family="Liberation Sans,sans-serif" font-size="24" fill="#15232C" font-weight="bold" text-anchor="start">Full fixture set:</text><text x="667" y="583" font-family="Liberation Mono,monospace" font-size="22" fill="#15232C" font-weight="normal" text-anchor="start">17 accept  /  28 reject</text><path d="M48 630 L1232 630" fill="none" stroke="#15232C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="48" y="676" font-family="Liberation Mono,monospace" font-size="17" fill="#15232C" font-weight="bold" text-anchor="start">DEMO: SEEDED FIXTURES</text><text x="1232" y="676" font-family="Liberation Sans,sans-serif" font-size="22" fill="#42525B" font-weight="normal" text-anchor="end">These are not observed API responses.</text></svg>
